<VirtualHost *:80>
  ServerName drupal.marina.org
  DocumentRoot /var/www/drupal
 
  <Directory /var/www/drupal/>
       Options FollowSymlinks
       AllowOverride All
       Require all granted
  </Directory>
 
     ErrorLog ${APACHE_LOG_DIR}/error_drupal.log
     CustomLog ${APACHE_LOG_DIR}/access_drupal.log combined
 
  <Directory /var/www/drupal/>
       RewriteEngine on
       RewriteBase /
       RewriteCond %{REQUEST_FILENAME} !-f
       RewriteRule ^(.*) index.php [PT,L]
  </Directory>
</VirtualHost>
