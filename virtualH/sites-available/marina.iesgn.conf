<VirtualHost *:80>

	ServerName marina.iesgn.org
	DocumentRoot /var/www/iesgn
        Redirect permanent / https://marina.iesgn.org/

	ErrorLog ${APACHE_LOG_DIR}/error_iesgn.log
	CustomLog ${APACHE_LOG_DIR}/access_iesgn.log combined

</VirtualHost>

#https

<VirtualHost *:443>
    ServerName marina.iesgn.org
    DocumentRoot /var/www/iesgn
    
    # SSL Configuration
    SSLEngine on
    SSLCertificateFile      /etc/apache2/ssl/marina.iesgn.org.cert.pem
    SSLCertificateKeyFile   /etc/apache2/ssl/marina.iesgn.org.key.pem
    SSLCertificateChainFile /etc/apache2/ssl/ca.cert.pem
    
    # Seguridad SSL moderna
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
    SSLHonorCipherOrder     off
    SSLSessionTickets       off
    
    # HSTS (opcional pero recomendado)
    Header always set Strict-Transport-Security "max-age=63072000"
    
    <Directory /var/www/iesgn>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    ErrorLog ${APACHE_LOG_DIR}/iesgn-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/iesgn-ssl-access.log combined
</VirtualHost>
